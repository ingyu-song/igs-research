# 1) PDF 파일을 assets/portfolio/pdf/ 에 업로드
# 2) (있으면) Excel 파일을 assets/portfolio/xlsx/ 에 업로드
# 3) 아래 형식으로 항목 추가
#
# id:        고유 식별자 (URL/파일명 안전 문자만)
# title:     카드에 표시되는 메모 제목
# company:   딜 타깃 회사
# acquirer:  인수자 / PE 펀드
# date:      YYYY-MM-DD (정렬 기준, 최신순)
# sector:    섹터명 (카드 색상 결정) — 아래 sector_slug 참고
# icon:      카드 좌상단 아이콘 이모지 (없으면 📊)
# summary:   카드 본문 설명 (1~2문장 권장)
# pdf:       PDF 파일명 (assets/portfolio/pdf/ 기준)
# xlsx:      Excel 파일명 (assets/portfolio/xlsx/ 기준, 선택)
# tags:      태그 리스트 (선택)
#
# 지원하는 sector_slug (CSS 색상 매핑):
#   asset-management, financial-services, consumer, industrial,
#   technology, healthcare, energy, real-estate, general
# =============================================================

