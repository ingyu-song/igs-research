# =============================================================
# Portfolio Data
# -------------------------------------------------------------
# 구조:
#   - 각 프로젝트(project)가 카드 하나
#   - 프로젝트 안에 files[] 목록 (Presentation, Report, Model 등)
#
# 파일 업로드 위치:
#   - PDF  → assets/portfolio/pdf/{filename}
#   - XLSX → assets/portfolio/xlsx/{filename}
#
# 필드:
#   id:       고유 식별자 (URL-safe)
#   title:    카드 제목
#   subtitle: 카드 부제 (선택)
#   date:     YYYY-MM-DD (정렬 기준, 최신순)
#   badge:    우측 상단 배지 텍스트 (예: First Runner Up)
#   tags:     태그 리스트 (선택)
#   summary:  카드 본문 설명 (1~2문장)
#   files:    파일 목록
#     - label:    파일 레이블 (예: Presentation, Report, Model)
#       file:     실제 파일명 (확장자 포함)
#       type:     pdf | xlsx
# =============================================================

