title: IGS Research
description: Korean PE / M&A Deal Research
baseurl: "/igs-research"
url: "https://ingyu-song.github.io"

# Jekyll 3 (GitHub Pages) 호환 설정
markdown: kramdown
highlighter: rouge

# 빌드 제외
exclude:
  - scraper/
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github/
  - vendor/
  - node_modules/

# 기본 레이아웃
defaults:
  - scope:
      path: ""
    values:
      layout: default
